[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "qcode"
version = "0.1.0"
description = "AI coding assistant"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "rich>=13.0",
    "textual>=0.40",
]

[project.scripts]
qcode = "qcode.harness.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["qcode*"]
