[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qcode"
version = "0.2.0"
description = "AI coding agent with team collaboration"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "httpx>=0.24",
    "requests>=2.28",
    "rich>=13.0",
    "textual>=0.40",
    "textual-autocomplete>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
qcode = "qcode.harness.cli:main"

[tool.setuptools.packages.find]
include = ["qcode*"]
